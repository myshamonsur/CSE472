<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>JavaScript Workshop</h1>

        <p>Welcome to the workshop registration page.</p>

        <div class="card">
            <h2>Available Seats</h2>

            <p id="seatMessage">Click the button to check available seats.</p>

            <button onclick="checkSeats()">Check Seats</button>
        </div>

        <div class="card">
            <h2>Student Greeting</h2>

            <label for="studentName">Enter your name:</label>

            <input type="text" id="studentName" placeholder="Enter your name">

            <button onclick="showGreeting()">Show Greeting</button>

            <p id="greetingMessage"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
